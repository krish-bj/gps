version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: vehicle_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vehicle_tracking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Mosquitto MQTT Broker (Security Enforced)
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: vehicle_mqtt_broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto_pwfile:/mosquitto/config/pwfile

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vehicle_fastapi_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@db:5432/vehicle_tracking_db"
      MQTT_BROKER_HOST: "mqtt"
      MQTT_BROKER_PORT: 1883
      MQTT_USERNAME: "gps_ingest_user"
      MQTT_PASSWORD: "gps_secure_pass_2026"
      SECRET_KEY: "supersecretjwtkey_vehicle_tracking_2026_dev_prod"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started


volumes:
  postgres_data:
